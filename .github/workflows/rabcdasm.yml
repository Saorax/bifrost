name: RABCDAsm

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-22.04 }
          - { rid: linux-arm64, os: ubuntu-22.04-arm }
          - { rid: osx-x64, os: macos-13 }
          - { rid: osx-arm64, os: macos-14 }
          - { rid: win-x64, os: windows-2022 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and self-test
        run: python tools/setup_rabcdasm.py
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          for n in abcexport rabcdasm rabcasm; do cp .tools/rabcdasm/bin/$n* out/; done
          cp reports/toolchain/rabcdasm*.json out/
      - uses: actions/upload-artifact@v4
        with:
          name: rabcdasm-${{ matrix.rid }}
          path: out/
